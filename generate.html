<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trích Xuất Face Descriptors</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@vladmandic/face-api/dist/face-api.min.js"></script>
</head>
<body class="bg-slate-950 text-white min-h-screen flex flex-col items-center justify-center p-4">

<div class="max-w-lg w-full bg-slate-900 border border-slate-800 p-6 rounded-2xl shadow-2xl">
    <h1 class="text-xl font-black text-amber-400 text-center mb-1">✦ TRÍCH XUẤT DESCRIPTORS ✦</h1>
    <p class="text-xs text-slate-400 text-center mb-5">Tự động dò toàn bộ ảnh trong labeled_images/&lt;tên&gt;/1.jpg, 2.jpg... cho tới khi hết ảnh</p>

    <button id="btn-run" onclick="generate()" class="w-full py-3.5 rounded-xl font-bold text-sm bg-gradient-to-r from-amber-500 to-yellow-600 hover:from-amber-600 hover:to-yellow-700 text-slate-950 shadow-lg shadow-amber-500/20 transition active:scale-95 cursor-pointer">
        BẮT ĐẦU QUÉT & TẢI DESCRIPTORS.JSON
    </button>

    <div class="mt-4">
        <p class="text-[11px] font-mono text-slate-400 mb-1">Nhật ký xử lý:</p>
        <div id="log-box" class="p-3 bg-black/60 rounded-xl text-xs font-mono h-56 overflow-y-auto space-y-1 text-slate-300 border border-slate-800">
            Chờ khởi động...
        </div>
    </div>
</div>

<script>
    // Danh sách người cần quét. KHÔNG cần khai số lượng ảnh — hệ thống sẽ tự dò
    // lần lượt 1.jpg, 2.jpg, 3.jpg... cho tới khi không còn ảnh nữa (tối đa MAX_IMAGES_PER_PERSON).
    // => Thêm/bớt ảnh trong thư mục labeled_images/<label>/ không cần sửa code ở đây nữa.
    const PEOPLE = ['ban_than', 'tu_mup', 'mai_chi'];
    const MAX_IMAGES_PER_PERSON = 30; // Giới hạn an toàn để vòng lặp dò ảnh không chạy vô hạn

    // Dùng chung nguồn model cục bộ với app.js để đảm bảo cùng phiên bản weight,
    // tránh lệch giữa lúc tạo descriptor và lúc nhận diện thực tế.
    const MODEL_URL = './models';

    const logBox = document.getElementById('log-box');
    function log(msg, color = 'text-slate-300') {
        logBox.innerHTML += `<div class="${color}">> ${msg}</div>`;
        logBox.scrollTop = logBox.scrollHeight;
    }

    // Thử tải 1 ảnh, trả về null nếu không tồn tại/lỗi (dùng để dò xem ảnh có tồn tại không)
    async function tryFetchImage(path) {
        try {
            return await faceapi.fetchImage(path);
        } catch (e) {
            return null;
        }
    }

    async function generate() {
        const btn = document.getElementById('btn-run');
        btn.disabled = true;
        btn.classList.add('opacity-50', 'cursor-not-allowed');

        log("Đang nạp AI Models nhận diện...", "text-amber-400");

        try {
            await Promise.all([
                faceapi.nets.ssdMobilenetv1.loadFromUri(MODEL_URL),
                faceapi.nets.faceLandmark68Net.loadFromUri(MODEL_URL),
                faceapi.nets.faceRecognitionNet.loadFromUri(MODEL_URL)
            ]);
            log("Đã nạp AI Models thành công!", "text-green-400");
        } catch (err) {
            log("Lỗi tải AI Models. Vui lòng kiểm tra lại thư mục /models!", "text-red-400");
            btn.disabled = false;
            btn.classList.remove('opacity-50', 'cursor-not-allowed');
            return;
        }

        const fullDescriptors = [];

        for (const label of PEOPLE) {
            log(`Đang quét đối tượng: [${label}]...`, "text-cyan-400");
            const personDescriptors = [];
            let missingStreak = 0;

            for (let i = 1; i <= MAX_IMAGES_PER_PERSON; i++) {
                const imgPath = `./labeled_images/${label}/${i}.jpg`;
                const img = await tryFetchImage(imgPath);

                if (!img) {
                    missingStreak++;
                    // Dừng dò cho người này nếu gặp liên tiếp 2 chỉ số ảnh không tồn tại
                    // (tránh dừng oan nếu chẳng may thiếu 1 file giữa chừng, ví dụ mất 2.jpg nhưng vẫn còn 3.jpg)
                    if (missingStreak >= 2) break;
                    continue;
                }
                missingStreak = 0;

                try {
                    const detection = await faceapi
                        .detectSingleFace(img)
                        .withFaceLandmarks()
                        .withFaceDescriptor();

                    if (detection) {
                        personDescriptors.push(Array.from(detection.descriptor));
                        log(`  ✔ Nhận diện tốt: ${label}/${i}.jpg`, "text-green-400");
                    } else {
                        log(`  ✖ Không tìm thấy khuôn mặt trong: ${label}/${i}.jpg`, "text-yellow-400");
                    }
                } catch (e) {
                    log(`  ✖ Lỗi xử lý ảnh: ${imgPath}`, "text-red-400");
                }
            }

            if (personDescriptors.length > 0) {
                log(`  → Tổng cộng ${personDescriptors.length} ảnh hợp lệ cho [${label}]`, "text-cyan-300");
                fullDescriptors.push({
                    label: label,
                    descriptors: personDescriptors
                });
            } else {
                log(`  ⚠ Cảnh báo: Không có vector nào cho [${label}]`, "text-red-400");
            }
        }

        if (fullDescriptors.length === 0) {
            log("Thất bại: Không trích xuất được khuôn mặt nào!", "text-red-500");
            btn.disabled = false;
            btn.classList.remove('opacity-50', 'cursor-not-allowed');
            return;
        }

        log("Trích xuất hoàn tất! Bắt đầu tải file descriptors.json...", "text-amber-400");

        const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(fullDescriptors, null, 2));
        const downloadAnchor = document.createElement('a');
        downloadAnchor.setAttribute("href", dataStr);
        downloadAnchor.setAttribute("download", "descriptors.json");
        document.body.appendChild(downloadAnchor);
        downloadAnchor.click();
        downloadAnchor.remove();

        log("✦ HOÀN THÀNH: descriptors.json ĐÃ ĐƯỢC TẢI VỀ! ✦", "text-green-400 font-bold");
        btn.disabled = false;
        btn.classList.remove('opacity-50', 'cursor-not-allowed');
    }
</script>
</body>
</html>
